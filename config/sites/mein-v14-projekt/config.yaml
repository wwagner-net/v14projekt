base: 'https://t3crr26.wwagner.info/'
baseVariants:
  -
    base: 'https://v14projekt.ddev.site/'
    condition: 'applicationContext == "Development"'
dependencies:
  - wwagner/vt14sitepackage
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=27'
  -
    errorCode: 403
    errorHandler: LoginRedirect
    loginRedirectTarget: 't3://page?uid=52'
    loginRedirectParameter: return_url
languages:
  -
    title: Deutsch
    enabled: true
    languageId: 0
    base: /
    locale: de_DE.utf8
    navigationTitle: Deutsch
    flag: de
    hreflang: de-DE
    websiteTitle: ''
  -
    title: English
    enabled: true
    locale: en_GB.utf8
    hreflang: en-GB
    base: /en/
    websiteTitle: 'Innovatech Solutions Inc.'
    navigationTitle: English
    fallbackType: strict
    fallbacks: ''
    flag: en-us-gb
    languageId: 1
  -
    title: Spanish
    enabled: true
    locale: es_ES
    hreflang: es-ES
    base: /es/
    websiteTitle: 'Innovatech Solutions S.L.'
    navigationTitle: Español
    fallbackType: strict
    fallbacks: ''
    flag: es
    languageId: 2
rootPageId: 1
routes:
  -
    route: robots.txt
    type: staticText
    content: "User-agent: *\r\n\r\nDisallow: /fileadmin/_processed_/\r\n\r\nSitemap: https://mein-v14-projekt.ddev.site/sitemap.xml"
websiteTitle: 'Innovatech Solutions'
