<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<!-- Direkt vor dem section-Tag -->
<section class="cta{data.uid} call-to-action section accent-background" style="{f:asset.styleAttr(value: '--background-color: {data.ctabgr}', csp: true)}" >
	<div class="container">
		<div class="row justify-content-center" data-aos="zoom-in" data-aos-delay="100">
			<div class="col-xl-10">
				<div class="text-center">
                    <f:variable name="header" value="{data -> f:render.text(field: 'header')}" />
					<h3>{header}</h3>
                    {data -> f:render.text(field: 'bodytext')}
					<f:link.typolink parameter="{data.header_link}" class="cta-btn">{data.subheader}</f:link.typolink>
				</div>
			</div>
		</div>
	</div>
</section>
</html>
