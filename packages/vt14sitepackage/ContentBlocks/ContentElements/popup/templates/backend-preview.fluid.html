<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">
        <div style="display: flex; gap: 1rem; align-items: flex-start;">
            <f:if condition="{data.image.0}">
                <f:image
                    image="{data.image.0}"
                    width="80"
                    height="60"
                    style="border-radius: 4px; object-fit: cover; flex-shrink: 0;"
                />
            </f:if>
            <div>
                <p style="margin: 0 0 0.25rem;">
                    <strong>Verzögerung:</strong> {data.popup_delay} Sekunden
                </p>
                <p style="margin: 0;">
                    <strong>Häufigkeit:</strong> {data.popup_frequency}
                </p>
                <f:if condition="{data.bodytext}">
                    <p style="margin: 0.5rem 0 0; color: #666;">
                        {data.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters: 80, append: '…')}
                    </p>
                </f:if>
            </div>
        </div>
    </cb:link.editRecord>
</f:section>

</html>
