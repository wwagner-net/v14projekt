<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">
        <f:for each="{data.members}" as="member">
            <p>
                <f:image image="{member.image.0}" height="80"/><br>
                <strong>{member.header}</strong><br>
                {member.subheader}
            </p>
        </f:for>
    </cb:link.editRecord>
</f:section>

<f:comment>
<!-- Uncomment to override preview footer -->
<f:section name="Footer">
    My custom Footer
</f:section>
</f:comment>
</html>
