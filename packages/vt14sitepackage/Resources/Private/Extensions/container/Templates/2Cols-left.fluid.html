<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="Main">
<f:spaceless>
	<div class="row">
		<div class="col-md-8">
			<f:for each="{content.100}" as="record">
				{record -> f:render.record()}
			</f:for>
		</div>
		<div class="col-md-4">
			<f:for each="{content.200}" as="record">
				{record -> f:render.record()}
			</f:for>
		</div>
	</div>
</f:spaceless>
</f:section>
</html>
