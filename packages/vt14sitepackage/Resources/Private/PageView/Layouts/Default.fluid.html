<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:spaceless>
	<f:page.meta property="viewport">width=device-width, initial-scale=1.0</f:page.meta>

	<f:page.headerData>
		<link href="{f:uri.resource(path: 'EXT:vt14sitepackage/Resources/Public/Images/favicon.svg')}" rel="icon">
		<link href="{f:uri.resource(path: 'EXT:vt14sitepackage/Resources/Public/Images/apple-touch-icon.png')}" rel="apple-touch-icon">
	</f:page.headerData>

	<f:asset.css identifier="bootstrap" href="EXT:vt14sitepackage/Resources/Public/vendor/bootstrap/css/bootstrap.min.css" csp="1"/>
	<f:asset.css identifier="bootstrap-icons" href="EXT:vt14sitepackage/Resources/Public/vendor/bootstrap-icons/bootstrap-icons.css" />
	<f:asset.css identifier="aos" href="EXT:vt14sitepackage/Resources/Public/vendor/aos/aos.css" />
	<f:asset.css identifier="swiper" href="EXT:vt14sitepackage/Resources/Public/vendor/swiper/swiper-bundle.min.css" />
	<f:asset.css identifier="glightbox" href="EXT:vt14sitepackage/Resources/Public/vendor/glightbox/css/glightbox.min.css" />
	<f:asset.css identifier="main" href="EXT:vt14sitepackage/Resources/Public/Css/main.css" />

	<f:render partial="Header" arguments="{_all}"/>

	<main class="main">
		<f:render partial="Rootline" arguments="{_all}"/>

		<!--TYPO3SEARCH_begin-->
		<f:render section="Main"/>
		<!--TYPO3SEARCH_end-->

	</main>

	<f:render partial="Footer" arguments="{_all}"/>

	<!-- Scroll Top -->
	<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

	<!-- Preloader -->
	<div id="preloader"></div>

	<f:asset.script identifier="bootstrap" src="EXT:vt14sitepackage/Resources/Public/vendor/bootstrap/js/bootstrap.bundle.min.js" />
	<f:asset.script identifier="aos" src="EXT:vt14sitepackage/Resources/Public/vendor/aos/aos.js" />
	<f:asset.script identifier="purecounter" src="EXT:vt14sitepackage/Resources/Public/vendor/purecounter/purecounter_vanilla.js" />
	<f:asset.script identifier="waypoints" src="EXT:vt14sitepackage/Resources/Public/vendor/waypoints/noframework.waypoints.js" />
	<f:asset.script identifier="swiper" src="EXT:vt14sitepackage/Resources/Public/vendor/swiper/swiper-bundle.min.js" />
	<f:asset.script identifier="glightbox" src="EXT:vt14sitepackage/Resources/Public/vendor/glightbox/js/glightbox.min.js" />
	<f:asset.script identifier="imagesloaded" src="EXT:vt14sitepackage/Resources/Public/vendor/imagesloaded/imagesloaded.pkgd.min.js" />
	<f:asset.script identifier="isotope" src="EXT:vt14sitepackage/Resources/Public/vendor/isotope-layout/isotope.pkgd.min.js" />
	<f:asset.script identifier="main" src="EXT:vt14sitepackage/Resources/Public/JavaScript/main.js" />
</f:spaceless>
</html>
