<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:spaceless>
	<nav id="navmenu" class="navmenu">
		<ul>
			<f:for each="{mainMenu}" as="item">
				<f:render section="MenuItem" arguments="{_all}"/>
			</f:for>
		</ul>
		<i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
	</nav>

	<f:section name="MenuItem">
		<li class="{f:if(condition: item.children, then: 'dropdown')}">
			<f:variable name="itemTextWrap" value="|" />
			<f:if condition="{item.children}">
				<f:variable name="itemTextWrap" value='<span>|</span> <i class="bi bi-chevron-down toggle-dropdown"></i>' />
			</f:if>
			<f:link.typolink parameter="{item.data.uid}" class="{f:if(condition: item.current, then: 'active')}" textWrap="{itemTextWrap}">
				{item.title}
			</f:link.typolink>
			<f:if condition="{item.children}">
				<ul>
					<f:for each="{item.children}" as="item">
						<f:render section="MenuItem" arguments="{_all}"/>
					</f:for>
				</ul>
			</f:if>
		</li>
	</f:section>
</f:spaceless>
</html>
